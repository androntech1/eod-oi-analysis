name: NSE EOD OI Analysis & Reporting

on:
  schedule:
    # 10:30 UTC = 16:00 IST (Mon-Fri after Indian Market Close)
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "eod-analysis"
  cancel-in-progress: false

jobs:
  analyze_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run EOD OI Analysis
        run: |
          python main.py --symbol NIFTY

      - name: Commit and Push Updated EOD Data & Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ docs/ README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(eod): automated EOD OI analysis for $(date +'%Y-%m-%d') [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
